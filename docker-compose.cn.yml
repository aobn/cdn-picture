version: '3.8'

services:
  # 开发环境 - 中国大陆优化版
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.cn
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles:
      - dev

  # 生产环境 - 中国大陆优化版
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile.cn
      target: production
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    profiles:
      - prod

  # 生产环境（自定义端口）- 中国大陆优化版
  app-prod-custom:
    build:
      context: .
      dockerfile: Dockerfile.cn
      target: production
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    profiles:
      - prod-custom